name: bihar_stet_cs_prep
description: "Offline Bihar STET 2026 Paper 2 Computer Science preparation app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/syllabus.json
    - assets/data/questions.json
    - assets/data/teaching_aptitude.json
    - assets/data/notes.json
